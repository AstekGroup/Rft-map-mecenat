project: make-map
default_env: prod

envs:
  prod:
    provider: local-dev
    prefix: make-map/prod/
    keys:
      # Backend (Baserow)
      - BASEROW_API_URL
      - BASEROW_API_TOKEN
      - BASEROW_EVENT_TABLE_ID
      - BASEROW_MODERATION_FIELD_ID
      - BASEROW_PARTNERS_TABLE_ID
      - BASEROW_THEMATIQUES_TABLE_ID
      - BASEROW_FORMATS_TABLE_ID
      - BASEROW_PUBLICS_TABLE_ID
      # Frontend
      - VITE_API_URL
      # Scaleway
      - SCW_ACCESS_KEY
      - SCW_SECRET_KEY
      - SCW_PROJECT_ID
      - SCW_INSTANCE_IP
      # Production
      - DOMAIN
      - CORS_ORIGIN
